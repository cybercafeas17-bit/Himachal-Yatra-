
name: Build Himachal Yatra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract updated Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'HimachalYatra-Android-Project-v2.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: HimachalYatra-Android-Project-v2.zip was not found in the repository root."
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Himachal-Yatra-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk

          
